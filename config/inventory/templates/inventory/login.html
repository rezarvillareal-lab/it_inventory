{% extends 'inventory/base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-lg-5">
                <div class="text-center mb-4">
                    <div class="rounded-3 bg-primary bg-opacity-10 px-3 py-2 text-primary fw-bold d-inline-block">Secure Access</div>
                    <h2 class="section-title mt-3 mb-2">Login</h2>
                    <p class="text-muted mb-0">Sign in to continue to the IT Inventory system.</p>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        {{ form.username.label_tag }}
                        {{ form.username }}
                    </div>

                    <div class="mb-4">
                        {{ form.password.label_tag }}
                        {{ form.password }}
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
